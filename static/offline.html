<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f766e" />
    <title>MediQueue — Offline</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f1f5f9;
        color: #0f172a;
        padding: 24px;
      }
      .card {
        width: min(420px, 100%);
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 20px;
        padding: 28px;
        text-align: center;
        box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
      }
      .icon {
        width: 56px;
        height: 56px;
        margin: 0 auto 12px;
        border-radius: 16px;
        display: grid;
        place-items: center;
        background: #ccfbf1;
        color: #0f766e;
        font-size: 28px;
      }
      h1 {
        font-size: 1.25rem;
        margin: 0 0 6px;
      }
      p {
        color: #64748b;
        font-size: 0.9rem;
        line-height: 1.5;
        margin: 0 0 18px;
      }
      button {
        border: 0;
        border-radius: 12px;
        background: #0f766e;
        color: #fff;
        font-weight: 700;
        padding: 11px 18px;
        width: 100%;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon">&#9993;</div>
      <h1>You are offline</h1>
      <p>
        MediQueue needs a connection to show live queue numbers. Reconnect to the
        hospital network or mobile data, then try again.
      </p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
